name: Connected Instrumentation Tests

# Manual only: the androidTest sources do not compile yet
on:
  workflow_dispatch: {}

jobs:
  connected-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        api_level: [35, 36]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run connected instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api_level }}
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -no-snapshot -no-audio
          working-directory: ComicRackCE
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon

      - name: Upload connected test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connected-reports-api${{ matrix.api_level }}
          path: ComicRackCE/app/build/reports/androidTests/connected/
