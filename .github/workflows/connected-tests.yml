name: Connected Instrumentation Tests

on:
  workflow_dispatch: {}
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  connected-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        api_level: [35, 36]
    env:
      ADB_INSTALL_TIMEOUT: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*','**/gradle-wrapper.properties') }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: ${{ matrix.api_level }}
          build-tools: 34.0.0
          target: google_apis

      - name: Start emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -no-snapshot -no-audio
          script: |
            echo "Emulator ready"

      - name: Wait for device
        run: |
          adb wait-for-device
          adb devices

      - name: Run connected instrumentation tests twice
        run: |
          set -e
          ./gradlew :app:connectedDebugAndroidTest --no-daemon
          ./gradlew :app:connectedDebugAndroidTest --no-daemon

      - name: Upload connected test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: connected-runs
          path: app/build/connected-runs/**
