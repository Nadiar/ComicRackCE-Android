name: Auto-commit log check

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *' # daily at 03:00 UTC

jobs:
  check_auto_commits:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run auto-commit log check (non-blocking)
        # Run the check but do not fail the workflow if it reports stale/missing entries.
        # If the check fails, we upload the log for inspection.
        run: |
          set -e
          python .copilot/subagent-flow/scripts/check_auto_commits.py --max-age-days 7 || echo "WARNING: No recent auto-commit found (non-blocking)"
        continue-on-error: true

      - name: Prepare artifact directory (if log exists)
        id: prepare-artifact-directory
        run: |
          if [ -f .copilot/subagent-flow/logs/auto_commits.log ]; then
            mkdir -p artifacts
            cp .copilot/subagent-flow/logs/auto_commits.log artifacts/
            echo "LOG_FOUND=1" >> $GITHUB_OUTPUT
          else
            echo "LOG_FOUND=0" >> $GITHUB_OUTPUT
          fi

      - name: Upload auto-commit log (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auto-commits-log
          path: artifacts
