name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-cache

      - name: Install Android SDK components
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip libstdc++6
          mkdir -p $HOME/android-sdk
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          yes | sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;34.0.0" "system-images;android-35;google_apis;x86_64"

      - name: Start emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: default
          emulator-options: -no-window -no-audio

      - name: Build and run instrumentation tests
        working-directory: src
        run: |
          chmod +x gradlew || true
          ./gradlew :app:assembleDebug :app:connectedAndroidTest -x lint --no-daemon --stacktrace
