# Enable AndroidX and Jetifier for migration
android.useAndroidX=true
android.enableJetifier=true

# Disable AGP 9.0's built-in Kotlin so Hilt and KSP can work
android.builtInKotlin=false

# Opt-out of the mandatory New DSL to support current Hilt versions
android.newDsl=false

org.gradle.configuration-cache=true
org.gradle.caching=true

# Increase Gradle JVM memory to avoid R8 / Daemon metaspace failures
org.gradle.jvmargs=-Xmx4g -XX:ActiveProcessorCount=4 -Dfile.encoding=UTF-8
org.gradle.workers.max=4
